<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - StreamBox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="form-page">
    <form id="loginForm" class="form-card">
      <a class="logo" href="index.html">StreamBox</a>
      <h1>User Login</h1>
      <p class="muted">Welcome back. Sign in to continue watching.</p>

      <label>
        Email
        <input id="email" type="email" required>
      </label>

      <label>
        Password
        <input id="password" type="password" required>
      </label>

      <p id="message" class="message"></p>
      <button class="button primary full" type="submit">Login</button>
      <p class="form-footer">New user? <a href="signup.html">Create an account</a></p>
      <p class="form-footer"><a href="admin-login.html">Admin login</a></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

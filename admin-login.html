<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - StreamBox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="form-page">
    <form id="adminLoginForm" class="form-card">
      <a class="logo" href="index.html">StreamBox</a>
      <h1>Admin Login</h1>
      <p class="muted">Manage the platform from the dashboard.</p>

      <label>
        Email
        <input id="adminEmail" type="email" required>
      </label>

      <label>
        Password
        <input id="adminPassword" type="password" required>
      </label>

      <p id="adminMessage" class="message"></p>
      <button class="button primary full" type="submit">Login as Admin</button>
      <p class="form-footer"><a href="login.html">Back to user login</a></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
